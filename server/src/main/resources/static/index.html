<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jolt</title>
  <link rel="stylesheet" href="hljs/theme-github-dark.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- Top bar -->
    <header class="topbar">
      <span class="logo">Jolt</span>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search code…  (Ctrl+Shift+F)" autocomplete="off">
        <button class="semantic-toggle" id="semantic-toggle" title="Toggle semantic search" aria-label="Toggle semantic search">&#x2728;</button>
        <div class="suggest-dropdown" id="suggest-dropdown" role="listbox"></div>
      </div>
      <button class="feedback-btn" id="feedback-btn" title="Report issue" aria-label="Report issue">&#x1F41B;</button>
      <button class="settings-btn" id="settings-btn" title="Settings" aria-label="Settings">&#x2699;</button>
    </header>

    <!-- Sidebar container -->
    <div class="sidebar-container">

      <!-- File tree -->
      <nav class="sidebar" id="file-tree" aria-label="File tree">
        <div class="section-label">Project</div>
        <!-- populated by app.js -->
      </nav>

      <!-- Bookmarks -->
      <nav class="sidebar-section" id="bookmark-section" aria-label="Bookmarks">
        <div class="section-label">Bookmarks</div>
        <div id="bookmark-list"></div>
      </nav>

      <!-- Recent files -->
      <nav class="sidebar-section" id="recent-section" aria-label="Recent files">
        <div class="section-label">Recent</div>
        <div id="recent-list"></div>
      </nav>

    </div>

    <!-- Main: tabs + breadcrumb + code viewer -->
    <main class="main">

      <!-- Tab bar -->
      <div class="tab-bar" id="tab-bar" role="tablist"></div>

      <!-- Breadcrumb + Blame toggle -->
      <div class="breadcrumb-bar">
        <div class="breadcrumb" id="breadcrumb"></div>
        <button class="blame-toggle" id="blame-toggle" title="Toggle git blame" aria-label="Toggle git blame">Blame</button>
      </div>

      <!-- Code viewer -->
      <div class="code-viewer" id="code-viewer">
        <div class="welcome">
          <div class="welcome-logo">Jolt</div>
          <p class="welcome-sub">Java code explorer &amp; agent output reviewer</p>
          <div class="welcome-hints">
            <div class="hint-item"><span class="hint-icon">&#x2022;</span><span>Search code with <kbd>Ctrl+Shift+F</kbd></span></div>
            <div class="hint-item"><span class="hint-icon">&#x2022;</span><span>Click files in the tree to open tabs</span></div>
            <div class="hint-item git-hint"><span class="hint-icon">&#x2022;</span><span>This project is tracked with Git. View commit history, diffs &amp; contributor stats <a href="/git" class="git-link">&rarr;</a></span></div>
          </div>
        </div>
      </div>

    </main>

  </div>

  <!-- Search results panel (slides in from right) -->
  <aside class="search-panel" id="search-panel" aria-label="Search results">
    <div class="panel-header">
      <strong>Results</strong>
      <button id="search-history-btn" title="Search history" aria-label="Search history">&#x231A;</button>
      <button id="search-close" aria-label="Close search">&times;</button>
    </div>
    <div class="search-history" id="search-history">
      <div id="search-history-list"></div>
    </div>
    <div id="search-results"></div>
  </aside>

  <!-- Settings panel (slides in from right) -->
  <aside class="settings-panel" id="settings-panel" aria-label="Settings">
    <div class="panel-header">
      <strong>Settings</strong>
      <button id="settings-close" aria-label="Close settings">&times;</button>
    </div>

    <div class="settings-section">
      <h3>Search</h3>
      <div class="setting-row">
        <label for="set-fuzzy-edits">Fuzzy max edits</label>
        <input type="number" id="set-fuzzy-edits" min="0" max="3" step="1">
      </div>
      <div class="setting-row">
        <label for="set-suggest-limit">Suggestion limit</label>
        <input type="number" id="set-suggest-limit" min="1" max="50" step="1">
      </div>
    </div>

    <div class="settings-section">
      <h3>Git Diff</h3>
      <div class="setting-row">
        <label for="set-diff-maxlines">Max lines per file</label>
        <input type="number" id="set-diff-maxlines" min="100" max="10000" step="100">
      </div>
      <div class="setting-row">
        <label for="set-diff-view">Default view</label>
        <select id="set-diff-view">
          <option value="unified">Unified</option>
          <option value="split">Split</option>
          <option value="raw">Raw</option>
        </select>
      </div>
    </div>

    <button class="settings-save-btn" id="settings-save">Save Settings</button>
    <div class="settings-saved-msg" id="settings-saved-msg"></div>
  </aside>

  <!-- Inspector panel (navigation results: definition, references, hierarchy, call graph) -->
  <aside class="inspector-panel" id="inspector-panel" aria-label="Inspector">
    <div class="panel-header">
      <strong id="inspector-title">Inspector</strong>
      <button id="inspector-close" aria-label="Close inspector">&times;</button>
    </div>
    <div id="inspector-body"></div>
  </aside>

  <!-- Feedback modal -->
  <div class="modal-backdrop" id="feedback-modal">
    <div class="modal-content">
      <div class="panel-header">
        <strong>Report an Issue</strong>
        <button id="feedback-close" aria-label="Close">&times;</button>
      </div>
      <form id="feedback-form">
        <div class="setting-row">
          <label for="fb-page">Page</label>
          <input type="text" id="fb-page" readonly>
        </div>
        <div class="setting-row">
          <label for="fb-file">File</label>
          <input type="text" id="fb-file" placeholder="(optional)">
        </div>
        <div class="setting-row">
          <label for="fb-message">Message</label>
          <textarea id="fb-message" rows="4" placeholder="Describe the issue…"></textarea>
        </div>
        <button type="submit" class="settings-save-btn">Submit</button>
      </form>
      <div id="fb-status"></div>
    </div>
  </div>

  <script src="hljs/highlight.min.js"></script>
  <script type="module" src="app.js"></script>

  <!-- Dev live-reload via WebSocket HMR: active only when ?dev is in the URL -->
  <script>
    if (new URLSearchParams(location.search).has('dev')) {
      (function() {
        const ws = new WebSocket('ws://' + location.host + '/ws/hmr');
        ws.onmessage = function(e) {
          var data = JSON.parse(e.data);
          if (data.type === 'reload') {
            console.log('[jolt-dev] File changed, reloading…');
            location.reload();
          }
        };
        ws.onclose = function() { console.log('[jolt-dev] HMR connection closed'); };
      })();
    }
  </script>

</body>
</html>
